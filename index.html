<!DOCTYPE HTML>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>タイトル</title>
<link href="css/reset.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">

<!--jQuery本体-->
<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>

<!-- 必ず上のjQueryライブラリを読み込んでから -->
<script src="js/mgGlitch-sample/mgGlitch.min.js"></script>
<!-- 公式サイト -->
<!-- https://github.com/hmongouachon/mgGlitch -->

</head>

<body>

    <div id="mv">
        <div id="mv-image">
            <h1 class="mv-text">Purple Infection</h1>
        </div>
    </div>

    <script>
        $(function(){
            $('#mv-image').mgGlitch({
                // trueならプラグインを終了
                destroy : false, 
                // falseならグリッチ処理を停止
                glitch: true, 
                // falseなら拡縮を終了
                scale: true, 
                // falseで画像の混乱を終了  
                blend : true, 
                // エフェクトタイプを指定
                blendModeType : "overlay",
                // 1つ目のグリッチ用要素の最短ディレイ秒数
                glitch1TimeMin : 600, 
                // 1つ目のグリッチ用要素の最長ディレイ秒数
                glitch1TimeMax : 1200,
                // 2つ目のグリッチ用要素の最短ディレイ秒数
                glitch2TimeMin : 200, 
                // 2つ目のグリッチ用要素の最長ディレイ秒数
                glitch2TimeMax : 600, 
                zIndexStart: 3
            });
        });
    </script>

</body>

</html>
